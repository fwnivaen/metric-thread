name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --extra dev --extra extract
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync metric-ledger demo --output workspace/ci-demo --replay-extraction
      - run: uv run --no-sync python -m build
      - name: Install built wheel and verify packaged example
        shell: bash
        run: |
          python -m venv wheel-env
          uv pip install --python wheel-env --no-deps dist/*.whl
          uv pip install --python wheel-env 'duckdb>=1.5.6,<2' 'pydantic>=2.10,<3'
          if [ -x wheel-env/bin/python ]; then PY=wheel-env/bin/python; else PY=wheel-env/Scripts/python.exe; fi
          "$PY" -m metric_ledger demo --output workspace/wheel-demo
